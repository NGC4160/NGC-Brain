<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="ngc-base" content="../" />
  <meta name="theme-color" content="#080b10" />
  <title>Documents — NGC Command Center</title>
  <link rel="stylesheet" href="../assets/command.css" />
  <style>
    .docs-hero {
      padding: 1.25rem 0 0.5rem;
      border-bottom: 1px solid var(--border, rgba(255,255,255,0.08));
      margin-bottom: 1.25rem;
    }
    .docs-hero h1 {
      margin: 0 0 0.35rem;
      font-size: 1.45rem;
    }
    .docs-hero p {
      margin: 0;
      color: var(--text-secondary);
      max-width: 46rem;
      line-height: 1.45;
    }
    .docs-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.85rem;
    }
    .docs-chip {
      font-size: 0.75rem;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--border, rgba(255,255,255,0.12));
      color: var(--text-secondary);
    }
    .docs-section {
      margin-bottom: 1.75rem;
    }
    .docs-section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.65rem;
    }
    .docs-section h2 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }
    .docs-section .cat-desc {
      margin: 0.2rem 0 0;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .docs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.65rem;
    }
    .docs-card {
      display: block;
      padding: 0.85rem 0.95rem;
      border-radius: 12px;
      background: var(--glass, rgba(255,255,255,0.04));
      border: 1px solid var(--border, rgba(255,255,255,0.08));
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .docs-card:hover {
      border-color: var(--cat-color, #38bdf8);
      transform: translateY(-1px);
    }
    .docs-card.planned {
      opacity: 0.72;
      border-style: dashed;
      cursor: default;
    }
    .docs-card.planned:hover {
      transform: none;
    }
    .docs-card strong {
      display: block;
      margin-bottom: 0.25rem;
      font-size: 0.92rem;
    }
    .docs-card span {
      display: block;
      color: var(--text-secondary);
      font-size: 0.8rem;
      line-height: 1.35;
    }
    .docs-card .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.55rem;
    }
    .docs-tag {
      font-size: 0.68rem;
      padding: 0.15rem 0.4rem;
      border-radius: 6px;
      border: 1px solid var(--border, rgba(255,255,255,0.12));
      color: var(--text-muted, #94a3b8);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .docs-tag.active {
      border-color: rgba(111, 170, 45, 0.45);
      color: #6faa2d;
    }
    .docs-tag.planned-tag {
      border-color: rgba(245, 158, 11, 0.4);
      color: #f59e0b;
    }
    .docs-empty {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .docs-footnote {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border, rgba(255,255,255,0.08));
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.45;
      max-width: 40rem;
    }
    .docs-footnote code {
      font-size: 0.76rem;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>

  <div id="login-gate" class="login-gate hidden">
    <div class="login-panel">
      <img class="login-logo" src="../assets/ngc-logo.png" alt="NGC" />
      <h1>Command Center</h1>
      <p class="subtitle">Ryan &amp; Christine only</p>
      <form id="login-form">
        <label for="login-user">Operator</label>
        <select id="login-user" name="user">
          <option value="Ryan">Ryan White</option>
          <option value="Christine">Christine White</option>
        </select>
        <label for="login-password">Access code</label>
        <input id="login-password" type="password" autocomplete="current-password" required />
        <button type="submit">Enter</button>
        <p id="login-error" class="login-error" role="alert"></p>
      </form>
    </div>
  </div>

  <div class="shell">
    <header class="topbar">
      <div class="topbar-brand">
        <img src="../assets/ngc-logo.png" alt="" />
        <div>
          <h1>Documents</h1>
          <span><a href="../index.html">← Command Center</a> · <a href="../explore.html">Full Index</a></span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn-ghost" id="logout-btn" type="button">Logout</button>
      </div>
    </header>

    <main class="main-content" style="padding: 1rem 1.25rem 2rem; max-width: 1100px; margin: 0 auto;">
      <section class="docs-hero">
        <h1>Working documents</h1>
        <p>Hiring scorecards, HR forms, shop tools, and customer handouts — organized by category. Open PDFs and forms directly; guides open in the viewer.</p>
        <div class="docs-meta" id="docs-meta"></div>
      </section>
      <div id="docs-root"><p class="docs-empty">Loading documents…</p></div>
      <p class="docs-footnote" id="docs-howto"></p>
    </main>
  </div>

  <script src="../assets/auth-config.js"></script>
  <script src="../assets/auth.js"></script>
  <script>
    const BASE = document.querySelector('meta[name="ngc-base"]')?.content || "../";

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function itemHref(item) {
      const href = item.href || "documents/index.html";
      if (/^https?:\/\//i.test(href)) return href;
      if (href.startsWith("view.html")) return `${BASE}${href}`;
      if (href.startsWith("documents/")) {
        // Relative to this page when same hub; otherwise from site root via BASE
        if (href === "documents/index.html") return "./index.html";
        return `${BASE}${href}`;
      }
      return `${BASE}${href.replace(/^\.\//, "")}`;
    }

    function renderCatalog(catalog) {
      const root = document.getElementById("docs-root");
      const meta = document.getElementById("docs-meta");
      const howto = document.getElementById("docs-howto");

      if (!catalog?.categories?.length) {
        root.innerHTML = `<p class="docs-empty">Documents catalog missing. Redeploy Command Center after merging.</p>`;
        return;
      }

      const counts = catalog.counts || {};
      meta.innerHTML = `
        <span class="docs-chip">${counts.active ?? 0} active</span>
        <span class="docs-chip">${counts.planned ?? 0} planned</span>
        <span class="docs-chip">${catalog.categories.length} categories</span>
      `;

      const byCat = {};
      for (const item of catalog.items || []) {
        (byCat[item.category] ||= []).push(item);
      }

      const html = [];
      for (const cat of catalog.categories) {
        const items = byCat[cat.id] || [];
        const active = items.filter((i) => i.status === "active");
        const planned = items.filter((i) => i.status !== "active");
        const ordered = [...active, ...planned];

        html.push(`<section class="docs-section" id="${escapeHtml(cat.id)}" style="--cat-color:${escapeHtml(cat.color || "#38bdf8")}">
          <div class="docs-section-head">
            <div>
              <h2>${escapeHtml(cat.title)}</h2>
              <p class="cat-desc">${escapeHtml(cat.description || "")}</p>
            </div>
            <span class="docs-chip">${active.length} ready${planned.length ? ` · ${planned.length} planned` : ""}</span>
          </div>
          <div class="docs-grid">
            ${ordered.length ? ordered.map((item) => {
              const plannedItem = item.status !== "active";
              const tag = plannedItem ? "planned" : (item.type || "doc");
              const audience = item.audience ? `<span class="docs-tag">${escapeHtml(item.audience)}</span>` : "";
              const statusTag = plannedItem
                ? `<span class="docs-tag planned-tag">Planned</span>`
                : `<span class="docs-tag active">Active</span>`;
              const typeTag = `<span class="docs-tag">${escapeHtml(tag)}</span>`;
              if (plannedItem) {
                return `<div class="docs-card planned">
                  <strong>${escapeHtml(item.title)}</strong>
                  <span>${escapeHtml(item.description || "")}</span>
                  <div class="meta">${statusTag}${typeTag}${audience}</div>
                </div>`;
              }
              const external = item.external ? ' target="_blank" rel="noopener"' : "";
              return `<a class="docs-card" href="${escapeHtml(itemHref(item))}"${external}>
                <strong>${escapeHtml(item.title)}</strong>
                <span>${escapeHtml(item.description || "")}</span>
                <div class="meta">${statusTag}${typeTag}${audience}</div>
              </a>`;
            }).join("") : `<p class="docs-empty">No documents in this category yet.</p>`}
          </div>
        </section>`);
      }

      root.innerHTML = html.join("");
      howto.innerHTML = `<strong>Add a future document:</strong> append an entry in <code>scripts/documents_catalog.py</code>, put the file under <code>external_docs/templates/&lt;category&gt;/</code>, then rebuild the Command Center. ${escapeHtml(catalog.how_to_add || "")}`;
    }

    async function initDocuments() {
      document.getElementById("logout-btn")?.addEventListener("click", () => window.NGCAuth?.logout());
      try {
        const res = await fetch("./catalog.json");
        if (!res.ok) throw new Error(`Failed to load catalog (${res.status})`);
        renderCatalog(await res.json());
      } catch (err) {
        document.getElementById("docs-root").innerHTML =
          `<p class="docs-empty">${escapeHtml(err.message)}</p>`;
      }
    }

    window.onAuthSuccess = initDocuments;
    document.addEventListener("DOMContentLoaded", () => {
      if (window.NGCAuth?.isAuthed()) initDocuments();
    });
  </script>
</body>
</html>
