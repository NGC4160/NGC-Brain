name: Build Birdhouse Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/birdhouse-print-shop-mvp-838f
      - main
    paths:
      - "tools/birdhouse-print-shop/**"
      - ".github/workflows/birdhouse-windows.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/birdhouse-print-shop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Build exe
        run: pyinstaller --noconfirm birdhouse.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BirdhousePrintShop-Windows
          path: tools/birdhouse-print-shop/dist/BirdhousePrintShop.exe
          if-no-files-found: error

      - name: Publish GitHub Release (manual / tag optional)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: birdhouse-desktop-${{ github.run_number }}
          name: Birdhouse Print Shop (Windows) build ${{ github.run_number }}
          files: tools/birdhouse-print-shop/dist/BirdhousePrintShop.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
