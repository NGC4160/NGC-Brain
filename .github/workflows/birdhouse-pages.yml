name: Deploy Birdhouse Web

on:
  push:
    branches:
      - main
      - cursor/birdhouse-print-shop-mvp-838f
      - cursor/birdhouse-web-app-baab
    paths:
      - "tools/birdhouse-print-shop/web/**"
      - ".github/workflows/birdhouse-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-birdhouse
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy birdhouse web
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: tools/birdhouse-print-shop/web
          target-folder: birdhouse
          branch: gh-pages
          clean: false
          commit-message: "Deploy Blake's Birdhouses web from ${{ github.sha }}"
