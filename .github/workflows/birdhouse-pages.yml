name: Deploy Birdhouse Web

on:
  push:
    branches:
      - main
      - cursor/birdhouse-print-shop-mvp-838f
      - cursor/birdhouse-web-app-baab
      - cursor/birdhouse-shop-backup-e3d6
    paths:
      - "tools/birdhouse-print-shop/web/**"
      - ".github/workflows/birdhouse-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-birdhouse
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage public files
        run: |
          mkdir -p /tmp/birdhouse-web/js
          cp tools/birdhouse-print-shop/web/index.html /tmp/birdhouse-web/
          cp tools/birdhouse-print-shop/web/styles.css /tmp/birdhouse-web/
          cp tools/birdhouse-print-shop/web/.nojekyll /tmp/birdhouse-web/
          cp tools/birdhouse-print-shop/web/js/store.js /tmp/birdhouse-web/js/
          cp tools/birdhouse-print-shop/web/js/app.js /tmp/birdhouse-web/js/

      - name: Deploy birdhouse web
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: /tmp/birdhouse-web
          target-folder: birdhouse
          branch: gh-pages
          clean: true
          commit-message: "Deploy Blake's Birdhouses web from ${{ github.sha }}"
