# Month-long shared use: Starter plan + persistent disk (does not sleep; keeps SQLite).
# Free plan is demos only — it sleeps and can wipe data on redeploy.
# https://dashboard.render.com/select-repo?type=blueprint
services:
  - type: web
    name: birdhouse-print-shop
    runtime: python
    plan: starter
    rootDir: tools/birdhouse-print-shop
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: birdhouse-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: RELOAD
        value: "0"
      - key: HOST
        value: "0.0.0.0"
      - key: BIRDHOUSE_DATA_DIR
        value: /var/data
