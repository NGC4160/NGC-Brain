[project]
name = "omi-second-brain"
version = "0.1.0"
description = "Local-first Omi → Obsidian second brain with MCP and Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
  "PyYAML>=6.0.2",
  "httpx>=0.28.0",
  "tenacity>=9.0.0",
  "rich>=13.9.0",
  "python-dateutil>=2.9.0",
  "chromadb>=0.6.0",
  "ollama>=0.4.0",
  "mcp>=1.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
