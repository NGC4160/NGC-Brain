{% extends "base.html" %}
{% block title %}Settings · {{ shop_name }}{% endblock %}
{% block content %}
<section class="panel" style="max-width:480px">
  <h2>Shop settings</h2>
  <form method="post" action="/settings" class="stack">
    <label>Shop name<input name="shop_name" value="{{ shop_name }}" required /></label>
    <label>Hourly labor rate ($ for hands-on finish/pack)<input name="hourly_rate" type="number" step="0.01" value="{{ hourly_rate }}" required /></label>
    <label>Filament waste factor (0.05 = 5%)<input name="waste_factor" type="number" step="0.01" value="{{ waste_factor }}" required /></label>
    <button type="submit">Save settings</button>
  </form>
</section>
{% endblock %}
