<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ shop_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <h1>{{ shop_name }}</h1>
        <p>Mission control · 3D print ops</p>
      </div>
      <nav>
        <a href="/" class="{% if nav == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/board" class="{% if nav == 'board' %}active{% endif %}">Board</a>
        <a href="/orders" class="{% if nav == 'orders' %}active{% endif %}">Orders</a>
        <a href="/products" class="{% if nav == 'products' %}active{% endif %}">Products</a>
        <a href="/materials" class="{% if nav == 'materials' %}active{% endif %}">Materials</a>
        <a href="/settings" class="{% if nav == 'settings' %}active{% endif %}">Settings</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
